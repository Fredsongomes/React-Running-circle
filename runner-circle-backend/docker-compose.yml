services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: runner
      POSTGRES_PASSWORD: runner
      POSTGRES_DB: runner_circle
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U runner -d runner_circle']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://runner:runner@db:5432/runner_circle
      JWT_SECRET: troque-esse-segredo-em-producao
      JWT_EXPIRES_IN: 7d
      API_BASE_URL: http://localhost:3000
      # localhost (qualquer porta) já é liberado; use para domínios de produção.
      CORS_ORIGINS: ''
      UPLOAD_MAX_MB: 15
    ports:
      - '3000:3000'
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
