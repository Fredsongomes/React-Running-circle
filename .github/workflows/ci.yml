name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Front-end (lint, testes e build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build

  backend:
    name: Back-end (lint, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner-circle-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runner-circle-backend/package-lock.json

      - run: npm ci
      # sem --fix: na CI o lint só verifica
      - run: npx eslint "{src,test}/**/*.ts"
      - run: npm test
      - run: npm run build
